[project]
name = "fungi-chromatic"
version = "0.1.0"
description = "Experimental Game Boy Color game and human-reviewed scene authoring tools"
requires-python = ">=3.10"
dependencies = ["Pillow>=10,<13", "numpy>=1.26,<3"]

[project.optional-dependencies]
demo = ["pyboy==2.7.0"]

[dependency-groups]
dev = ["black==25.1.0"]

[tool.uv]
package = false

[tool.black]
line-length = 100
target-version = ["py310"]
